<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1b18; rx: 6px; }
      .shell { fill: #8b2611; stroke: #5a170a; stroke-width: 0.8; stroke-linejoin: round; }
      .groove { stroke: #5a170a; stroke-width: 0.6; fill: none; stroke-linecap: round; }
      .leg { stroke: #c84b31; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .head { fill: #6b1d0d; }
      .antenna { stroke: #c84b31; stroke-width: 1; stroke-linecap: round; fill: none; }
      .eye { fill: #1e1b18; }
      .highlight { fill: #ffffff; opacity: 0.15; }
    </style>
  </defs>

  <!-- Legs (6 jointed limbs) -->
  <!-- Top Legs -->
  <path class="leg" d="M 12 11 L 7 8 L 5 10" />
  <path class="leg" d="M 20 11 L 25 8 L 27 10" />
  
  <!-- Middle Legs -->
  <path class="leg" d="M 11 16 L 5 16 L 4 19" />
  <path class="leg" d="M 21 16 L 27 16 L 28 19" />
  
  <!-- Back Legs -->
  <path class="leg" d="M 12 21 L 6 23 L 6 27" />
  <path class="leg" d="M 20 21 L 26 23 L 26 27" />

  <!-- Antennae -->
  <path class="antenna" d="M 13 6 L 10 3 L 8 4" />
  <path class="antenna" d="M 19 6 L 22 3 L 24 4" />

  <!-- Main Body / Abdomen (Broad, flat, oval shape characteristic of bedbugs) -->
  <path class="shell" d="M 16 9 C 9 9 8 13 8 19 C 8 25 11 28 16 28 C 21 28 24 25 24 19 C 24 13 23 9 16 9 Z" />

  <!-- Abdominal Segment Grooves -->
  <path class="groove" d="M 9.5 14 Q 16 16 22.5 14" />
  <path class="groove" d="M 8.8 17 Q 16 19.5 23.2 17" />
  <path class="groove" d="M 8.5 20 Q 16 23 23.5 20" />
  <path class="groove" d="M 9.5 23 Q 16 26 22.5 23" />

  <!-- Thorax/Pronotum (Flared shield-like structure behind head) -->
  <path class="head" d="M 12 8 C 12 8 13 11 16 11 C 19 11 20 8 20 8 C 21.5 8 22 10.5 21 12 C 19.5 13 12.5 13 11 12 C 10 10.5 10.5 8 12 8 Z" stroke="#5a170a" stroke-width="0.6" />

  <!-- Head -->
  <path class="head" d="M 13.5 7.5 C 13.5 5.5 14.5 4.5 16 4.5 C 17.5 4.5 18.5 5.5 18.5 7.5 Z" />
  
  <!-- Eyes -->
  <circle class="eye" cx="13" cy="6.5" r="0.75" />
  <circle class="eye" cx="19" cy="6.5" r="0.75" />

  <!-- Subtle Shell Highlight for Depth -->
  <path class="highlight" d="M 16 10 C 11.5 10 10 13 9.5 17 C 12 16 15 13 16 10 Z" />
</svg>
